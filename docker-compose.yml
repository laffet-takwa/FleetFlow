# FleetFlow — full local platform.
#
#   docker compose up --build                 application stack (Postgres, Kafka, Mongo, Redis, 8 services, SPA)
#   docker compose --profile elk up -d        additionally Elasticsearch, Logstash, Kibana
#   docker compose --profile discovery up -d  additionally the optional Eureka registry
#
# Defaults live in .env (copy .env.example). Every value is overridable, and nothing
# that looks like a credential is committed.

name: fleetflow

x-service-image: &service-image
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile.backend
  restart: unless-stopped

# Settings every Spring Boot service shares.
x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_PASSWORD: ${DB_PASSWORD:-fleetflow}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET:-fleetflow-local-development-secret-key-change-me-0123456789}
  FLEETFLOW_INTERNAL_TOKEN: ${FLEETFLOW_INTERNAL_TOKEN:-fleetflow-local-internal-token}
  SEED_ENABLED: ${SEED_ENABLED:-true}
  LOG_LEVEL_COM_FLEETFLOW: ${LOG_LEVEL_COM_FLEETFLOW:-INFO}
  TZ: UTC

x-local-logging: &local-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ------------------------------------------------------------------ datastores

  postgres:
    image: postgres:16-alpine
    container_name: fleetflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-fleetflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fleetflow}
      POSTGRES_DB: postgres
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/00-create-roles.sh:/docker-entrypoint-initdb.d/00-create-roles.sh:ro
      - ./infrastructure/docker/postgres/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-fleetflow} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [fleetflow-net]
    logging: *local-logging

  mongodb:
    image: mongo:7.0
    container_name: fleetflow-mongodb
    restart: unless-stopped
    command: ["--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: fleetflow_tracking
      TZ: UTC
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [fleetflow-net]
    logging: *local-logging

  redis:
    image: redis:7.4-alpine
    container_name: fleetflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [fleetflow-net]
    logging: *local-logging

  # ---------------------------------------------------------------- event bus

  kafka:
    image: apache/kafka:3.8.1
    container_name: fleetflow-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: fleetflow-kraft-cluster-01
      TZ: UTC
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks: [fleetflow-net]
    logging: *local-logging

  # Topics are declared explicitly rather than auto-created, so the event topology is
  # reviewable and the partition counts match the ordering requirements.
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: fleetflow-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./infrastructure/kafka/01-create-topics.sh:/opt/fleetflow/01-create-topics.sh:ro
    entrypoint: ["bash", "/opt/fleetflow/01-create-topics.sh"]
    restart: "no"
    networks: [fleetflow-net]
    logging: *local-logging

  # ------------------------------------------------------------------- services

  auth-service:
    <<: *service-image
    container_name: fleetflow-auth-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        MODULE: auth-service
    environment:
      <<: *service-env
      SERVER_PORT: "8081"
      DB_NAME: fleetflow_auth
      DB_USERNAME: fleetflow_auth
    ports:
      - "${AUTH_PORT:-8081}:8081"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fleetflow-net]
    logging: *local-logging

  customer-service:
    <<: *service-image
    container_name: fleetflow-customer-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        MODULE: customer-service
    environment:
      <<: *service-env
      SERVER_PORT: "8082"
      DB_NAME: fleetflow_customer
      DB_USERNAME: fleetflow_customer
    ports:
      - "${CUSTOMER_PORT:-8082}:8082"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fleetflow-net]
    logging: *local-logging

  warehouse-service:
    <<: *service-image
    container_name: fleetflow-warehouse-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        MODULE: warehouse-service
    environment:
      <<: *service-env
      SERVER_PORT: "8084"
      DB_NAME: fleetflow_warehouse
      DB_USERNAME: fleetflow_warehouse
      ORDER_SERVICE_URL: http://order-service:8083
    ports:
      - "${WAREHOUSE_PORT:-8084}:8084"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fleetflow-net]
    logging: *local-logging

  order-service:
    <<: *service-image
    container_name: fleetflow-order-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        MODULE: order-service
    environment:
      <<: *service-env
      SERVER_PORT: "8083"
      DB_NAME: fleetflow_order
      DB_USERNAME: fleetflow_order
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8084
    ports:
      - "${ORDER_PORT:-8083}:8083"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fleetflow-net]
    logging: *local-logging

  delivery-service:
    <<: *service-image
    container_name: fleetflow-delivery-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        MODULE: delivery-service
    environment:
      <<: *service-env
      SERVER_PORT: "8085"
      DB_NAME: fleetflow_delivery
      DB_USERNAME: fleetflow_delivery
      CUSTOMER_SERVICE_URL: http://customer-service:8082
    ports:
      - "${DELIVERY_PORT:-8085}:8085"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fleetflow-net]
    logging: *local-logging

  tracking-service:
    <<: *service-image
    container_name: fleetflow-tracking-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        MODULE: tracking-service
    environment:
      <<: *service-env
      SERVER_PORT: "8086"
      MONGODB_URI: mongodb://mongodb:27017/fleetflow_tracking
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${TRACKING_PORT:-8086}:8086"
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fleetflow-net]
    logging: *local-logging

  notification-service:
    <<: *service-image
    container_name: fleetflow-notification-service
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        MODULE: notification-service
    environment:
      <<: *service-env
      SERVER_PORT: "8087"
      DB_NAME: fleetflow_notification
      DB_USERNAME: fleetflow_notification
      ORDER_SERVICE_URL: http://order-service:8083
    ports:
      - "${NOTIFICATION_PORT:-8087}:8087"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8087/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fleetflow-net]
    logging: *local-logging

  # --------------------------------------------------------------------- edge

  api-gateway:
    <<: *service-image
    container_name: fleetflow-api-gateway
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        MODULE: api-gateway
    environment:
      <<: *service-env
      SERVER_PORT: "8080"
      DB_USERNAME: ""            # gateway owns no data
      AUTH_SERVICE_URL: http://auth-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      WAREHOUSE_SERVICE_URL: http://warehouse-service:8084
      DELIVERY_SERVICE_URL: http://delivery-service:8085
      TRACKING_SERVICE_URL: http://tracking-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8088,http://localhost:80}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth-service: { condition: service_healthy }
      customer-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      warehouse-service: { condition: service_healthy }
      delivery-service: { condition: service_healthy }
      tracking-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [fleetflow-net]
    logging: *local-logging

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: fleetflow-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      api-gateway: { condition: service_healthy }
    networks: [fleetflow-net]
    logging: *local-logging

  # ------------------------------------------------------------------ optional

  # Eureka is off by default: the gateway routes by explicit URL, so a registry would
  # add a moving part without changing behaviour.
  discovery-server:
    <<: *service-image
    container_name: fleetflow-discovery-server
    profiles: ["discovery"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
      args:
        MODULE: discovery-server
    environment:
      <<: *service-env
      SERVER_PORT: "8761"
      DB_USERNAME: ""
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
    networks: [fleetflow-net]
    logging: *local-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: fleetflow-elasticsearch
    profiles: ["elk"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx1g
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s
    networks: [fleetflow-net]
    logging: *local-logging

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: fleetflow-logstash
    profiles: ["elk"]
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx512m
      SERVICE_NAME: fleetflow
    volumes:
      - ./infrastructure/elk/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./infrastructure/elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - gelf-relay-data:/usr/share/logstash/data
    ports:
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [fleetflow-net]
    logging: *local-logging

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: fleetflow-kibana
    profiles: ["elk"]
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
    networks: [fleetflow-net]
    logging: *local-logging

networks:
  fleetflow-net:
    name: fleetflow-net
    driver: bridge

volumes:
  postgres-data:
  mongodb-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
  gelf-relay-data:
