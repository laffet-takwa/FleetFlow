name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'infrastructure/docker/Dockerfile.frontend'
      - 'infrastructure/docker/nginx.conf'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'infrastructure/docker/Dockerfile.frontend'
      - 'infrastructure/docker/nginx.conf'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # `vue-tsc` runs in strict mode with noUnusedLocals, so a stray import is a
      # build failure rather than something a reviewer notices later.
      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Upload the build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  image:
    name: Frontend image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.frontend
          build-args: |
            VITE_API_BASE_URL=/api
          tags: fleetflow/frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: The SPA must be reachable and proxy to the gateway
        run: |
          docker network create fleetflow-ci-net
          docker network connect fleetflow-ci-net fleetflow/frontend:ci 2>/dev/null || true
          docker run -d --name ff-front --network fleetflow-ci-net -p 8088:80 fleetflow/frontend:ci
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:8088/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8088/healthz
          curl -fsS http://localhost:8088/ | grep -q '<div id="app"' || {
            echo '::error::index.html was not served from the built SPA'
            exit 1
          }
          docker rm -f ff-front >/dev/null
          docker network rm fleetflow-ci-net >/dev/null