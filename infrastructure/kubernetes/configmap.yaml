# Non-sensitive configuration. Every value here is overridable per environment by
# creating a second ConfigMap with the same keys and applying it last.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetflow-config
  namespace: fleetflow
  labels:
    app.kubernetes.io/part-of: fleetflow
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"

  # ---------------------------------------------------------------- datastores
  # In-cluster DNS names. The Services in this directory back each of them.
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "fleetflow_placeholder"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MONGODB_URI: "mongodb://mongodb:27017/fleetflow_tracking"

  # ---------------------------------------------------------- service routing
  # Cluster DNS resolves each Deployment's Service, which is why the gateway needs
  # no service discovery server in this environment.
  AUTH_SERVICE_URL: "http://auth-service:8081"
  CUSTOMER_SERVICE_URL: "http://customer-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
  WAREHOUSE_SERVICE_URL: "http://warehouse-service:8084"
  DELIVERY_SERVICE_URL: "http://delivery-service:8085"
  TRACKING_SERVICE_URL: "http://tracking-service:8086"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8087"

  # ------------------------------------------------------------------ runtime
  SEED_ENABLED: "true"
  LOG_LEVEL_COM_FLEETFLOW: "INFO"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"