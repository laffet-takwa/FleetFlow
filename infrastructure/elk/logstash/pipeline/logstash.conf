# FleetFlow log pipeline.
#
# Every service writes structured console logs that already carry an
# `X-Correlation-ID` in the MDC. This pipeline turns those lines into documents keyed
# by that id, which is what makes the ELK demo worth having: a single correlation id
# follows one customer action through the gateway, the services it touches, and the
# Kafka events it produces.

input {
    tcp {
        port  => 5044
        codec => json_lines
    }
}

filter {
    # The JSON encoder in Spring Boot emits a field literally named "message".
    if [message] {
        raw_message => "%{message}"
    }

    # Extract the timestamp and level the logback pattern already formatted.
    grok {
        match => {
            "message" => "^%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:log_level}\s+\[%{DATA:correlation_id}\]\s+.*$"
        }
        tag_on_failure => ["_logstash_grok_failure"]
    }

    date {
        match  => ["log_timestamp", "ISO8601"]
        target => "@timestamp"
    }

    mutate {
        remove_field => ["log_timestamp", "agent", "host", "port", "ecs", "input", "event"]
        add_field => {
            "service_name" => "${SERVICE_NAME:fleetflow}"
        }
    }

    # A request that never produced a correlation id is still worth keeping, but it
    # must be searchable as such rather than as a broken id.
    if ![correlation_id] or [correlation_id] == "no-correlation-id" {
        mutate { add_field => { "correlation_id" => "none" } }
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "fleetflow-logs-%{+YYYY.MM.dd}"
    }

    # Echoing the event is what makes `docker compose --profile elk logs -f logstash`
    # usable for debugging the pipeline itself.
    stdout { codec => rubydebug }
}
