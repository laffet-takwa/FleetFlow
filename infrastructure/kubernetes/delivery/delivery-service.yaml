---
# ---------------------------------------------------------------------------
# delivery-service
#
# Probes use the actuator readiness/liveness groups. Readiness deliberately
# depends on the datastores: a pod that cannot reach Postgres must not receive
# traffic, but liveness must NOT, or a database outage would restart every
# replica in the namespace at once and turn a degradation into an outage.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  labels:
    app.kubernetes.io/name: delivery-service
    app.kubernetes.io/part-of: fleetflow
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: delivery-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: delivery-service
        app.kubernetes.io/part-of: fleetflow
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: delivery-service
          image: fleetflow/delivery-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: fleetflow-config
            - secretRef:
                name: fleetflow-secrets
          env:
            - name: SERVER_PORT
              value: "8085"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 400m
              memory: 640Mi
            limits:
              cpu: "400m"
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                # Lets in-flight requests and SSE streams drain before the pod goes away.
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 40
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  labels:
    app.kubernetes.io/name: delivery-service
    app.kubernetes.io/part-of: fleetflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: delivery-service
  ports:
    - name: http
      port: 8085
      targetPort: http
  sessionAffinity: None