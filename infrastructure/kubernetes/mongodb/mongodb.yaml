---
# ---------------------------------------------------------------------------
# MongoDB - the location history.
#
# History is append-only and time-limited by a TTL index on the receiving side,
# so a single replica with an emptyDir is acceptable for a demo. A real
# deployment would use a replica set, because a single node cannot survive a
# disk loss without losing the trail.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: fleetflow
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: fleetflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: fleetflow
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: fleetflow
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/part-of: fleetflow
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          command: ["--bind_ip_all"]
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: fleetflow_tracking
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}