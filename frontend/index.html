<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FleetFlow — smart logistics and delivery platform" />
    <meta name="theme-color" content="#2563EB" />
    <title>FleetFlow — Smart Logistics &amp; Delivery</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      (function () {
        try {
          var stored = localStorage.getItem('fleetflow.theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
            document.documentElement.classList.add('dark')
          }
        } catch (error) {
          /* Private browsing can deny storage; the light theme is a safe default. */
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
