# PLACEHOLDERS ONLY - this file contains no real credential.
#
# Generating a usable Secret locally (PowerShell):
#
#   $jwt = [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Maximum 256 }))
#   $tok = -join ((1..64) | ForEach-Object { '{0:x}' -f (Get-Random -Maximum 16) })
#   kubectl -n fleetflow create secret generic fleetflow-secrets `
#     --from-literal=JWT_SECRET=$jwt `
#     --from-literal=FLEETFLOW_INTERNAL_TOKEN=$tok `
#     --from-literal=DB_PASSWORD=fleetflow `
#     --dry-run=client -o yaml | kubectl apply -f -
#
# For anything shared, prefer External Secrets Operator or Sealed Secrets over a
# Secret committed to a repository.
apiVersion: v1
kind: Secret
metadata:
  name: fleetflow-secrets
  namespace: fleetflow
  labels:
    app.kubernetes.io/part-of: fleetflow
type: Opaque
stringData:
  # Generate with: openssl rand -base64 48
  JWT_SECRET: "REPLACE_ME_WITH_A_48_BYTE_RANDOM_SECRET"
  # Generate with: openssl rand -hex 32
  FLEETFLOW_INTERNAL_TOKEN: "REPLACE_ME_WITH_A_32_BYTE_RANDOM_HEX"
  DB_PASSWORD: "REPLACE_ME"
  POSTGRES_ADMIN_USER: "fleetflow"