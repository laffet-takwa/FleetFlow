---
# ---------------------------------------------------------------------------
# Kafka in KRaft mode (no ZooKeeper).
#
# Single replica, so the replication factors are all 1. `auto.create.topics.enable`
# is off: the topic list is applied by the job at the bottom of this file, which
# keeps the event topology reviewable instead of implicit.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: fleetflow
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: fleetflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: fleetflow
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: fleetflow
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: fleetflow
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            # Required by the KRaft controller role: without it the broker refuses to
            # start with "controller.listener.names must contain at least one value
            # appearing in the 'listeners' configuration".
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka:9093
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /tmp/kraft-combined-logs
            - name: CLUSTER_ID
              value: fleetflow-kraft-cluster-01
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /tmp/kraft-combined-logs
      volumes:
        - name: data
          emptyDir: {}
---
# Creates the FleetFlow topics with explicit partition counts. Runs to completion
# and is safe to re-apply, because --create is combined with --if-not-exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init-topics
  namespace: fleetflow
  labels:
    app.kubernetes.io/part-of: fleetflow
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-init-topics
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:3.8.1
          env:
            - name: BOOTSTRAP
              value: kafka:9092
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "waiting for the broker"
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --list >/dev/null 2>&1; do
                sleep 5
              done
              create() {
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" \
                  --create --if-not-exists --topic "$1" --partitions "$2" --replication-factor 1
              }
              create order.created 6
              create inventory.reserved 6
              create inventory.insufficient 3
              create delivery.assigned 6
              create delivery.picked-up 6
              create delivery.started 6
              create delivery.completed 6
              create delivery.failed 3
              create delivery.cancelled 3
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "${BOOTSTRAP}" --list